name: nexo_bank
description: "Nexo Bank: app de banca personas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: '>=7.0.0 <7.3.2'
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  intl: ^0.20.3
  uuid: ^4.6.0
  bloc_concurrency: ^0.3.0
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: '>=22.3.1 <23.0.0-0'
  pointycastle: ^4.0.0
  local_auth: ^3.0.2
  device_info_plus: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/experience/
    - assets/branding/splash_logo.png
    - assets/branding/splash_logo_dark.png

# Splash nativo (lo primero que se ve al abrir la app): logo centrado sobre
# fondo claro. Regenerar con: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F7F5F1"
  image: assets/branding/splash_logo.png
  color_dark: "#121417"
  image_dark: assets/branding/splash_logo_dark.png
  android_12:
    color: "#F7F5F1"
    image: assets/branding/splash_android12.png
    color_dark: "#121417"
    image_dark: assets/branding/splash_android12_dark.png
  android: true
  ios: true
  web: false

# Ícono de la app (mismo logo). Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#F7F5F1"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  remove_alpha_ios: true
